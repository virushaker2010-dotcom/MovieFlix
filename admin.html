<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b15"><title>MovieFlix Admin</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><b>▶</b> Movie<span>Flix</span></a><a href="index.html" class="icon">⌂</a></header>
<main class="admin">
<section id="loginPanel" class="panel login"><h1>لوحة التحكم</h1><p class="muted">سجّل دخول حساب المدير.</p>
<input id="email" class="input" type="email" placeholder="البريد الإلكتروني"><input id="password" class="input" type="password" placeholder="كلمة المرور"><button id="login" class="primary">تسجيل الدخول</button><p id="loginMsg" class="msg"></p></section>

<section id="dashboard" class="hidden">
<div class="admin-head"><div><h1>لوحة التحكم</h1><p class="muted">إدارة المحتوى من قاعدة البيانات السحابية.</p></div><button id="logout" class="secondary">خروج</button></div>
<div id="stats" class="stats"></div>
<div class="admin-grid">
<div class="panel"><h2 id="formTitle">إضافة محتوى</h2>
<form id="form">
<input type="hidden" id="editId">
<label>النوع</label><select id="type" class="input"><option value="movie">فيلم</option><option value="series">مسلسل</option></select>
<label>الاسم</label><input id="title" class="input" required>
<label>الوصف</label><textarea id="description" class="input" rows="4"></textarea>
<div class="two"><div><label>السنة</label><input id="year" class="input" type="number"></div><div><label>التقييم</label><input id="rating" class="input" type="number" step=".1" min="0" max="10" value="8"></div></div>
<label>التصنيف</label><input id="genre" class="input" placeholder="أكشن، دراما">
<label>صورة الغلاف</label><input id="poster" class="input" type="file" accept="image/*">
<label>ملف الفيديو</label><input id="video" class="input" type="file" accept="video/*">
<div id="episodeArea" class="hidden"><h3>الحلقات</h3><div id="episodes"></div><button type="button" id="addEpisode" class="secondary">+ إضافة حلقة</button></div>
<button class="primary" type="submit">حفظ</button><button id="cancel" class="secondary hidden" type="button">إلغاء التعديل</button>
</form></div>
<div class="panel"><div class="head"><h2>المحتوى</h2><input id="q" class="input search"></div><div id="list"></div></div>
</div></section>
</main>
<script src="js/config.js"></script><script src="js/admin.js"></script>
</body></html>
